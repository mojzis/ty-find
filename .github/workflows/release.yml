name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --strip
          manylinux: 2_28

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: maturin sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Full history: relnotes finds each note's release from the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.4.0

      # One file per user-visible change in release-notes/ (see `uvx --from git+https://github.com/mojzis/relnotes relnotes guide`).
      - name: Release notes
        run: uvx --from git+https://github.com/mojzis/relnotes relnotes body "$GITHUB_REF_NAME" > release-body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p wheels
          find dist -name '*.whl' -exec cp {} wheels/ \;
          find dist -name '*.tar.gz' -exec cp {} wheels/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: wheels/*
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/ty-find
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p wheels
          find dist -name '*.whl' -exec cp {} wheels/ \;
          find dist -name '*.tar.gz' -exec cp {} wheels/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          skip-existing: true
